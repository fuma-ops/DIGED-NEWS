<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.brand{position:absolute;top:120px;left:70px;display:flex;align-items:center;gap:16px}
.brand .logo{font-family:Anton;font-size:40px;letter-spacing:2px}
.brand .logo b{color:#e63946}
.tag{position:absolute;top:122px;right:70px;background:#e63946;font-weight:900;font-size:28px;padding:8px 18px;letter-spacing:2px;border-radius:6px}
.shade{position:absolute;left:0;right:0}
.head{position:absolute;top:200px;left:60px;right:60px;font-family:Anton;font-size:104px;line-height:1.02;padding-bottom:22px;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.7)}
.head .r{color:#ffd166}
.line{position:absolute;top:548px;left:64px;height:8px;background:#e63946;border-radius:4px}
.scene{position:absolute;left:60px;right:60px;top:610px;height:660px}
.card{background:rgba(10,14,28,.78);border:2px solid rgba(255,255,255,.12);border-radius:28px;padding:40px 44px;backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.big{font-family:Anton;font-size:190px;line-height:1;color:#ffd166}
.lbl{font-weight:800;font-size:40px;opacity:.95}
.sub{font-weight:600;font-size:32px;opacity:.8;margin-top:10px}
.badge{display:inline-block;margin-top:26px;background:#e63946;font-weight:900;font-size:36px;padding:12px 22px;border-radius:12px}
.duty{display:flex;align-items:flex-end;gap:60px;height:480px;padding:0 30px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:100%;border-radius:16px 16px 6px 6px;flex-shrink:0}
.val{font-family:Anton;font-size:76px;margin-bottom:10px;white-space:nowrap;flex-shrink:0}
.cap{font-weight:800;font-size:32px;margin-top:16px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:18px}
.chip{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);font-weight:800;font-size:40px;padding:12px 26px;border-radius:999px}
.chip.hot{background:#e63946;border-color:#e63946}
.caps{position:absolute;left:70px;right:70px;top:1330px;text-align:center;font-weight:900;font-size:62px;line-height:1.18;text-transform:uppercase;text-shadow:0 4px 16px rgba(0,0,0,.95),0 0 4px #000}
.caps span{opacity:.55}.caps span.on{opacity:1}.caps span.now{color:#ffd166;opacity:1}
.src{position:absolute;left:70px;bottom:250px;font-weight:600;font-size:24px;opacity:.75}
</style></head><body>
<div class="shade" style="top:0;height:760px;background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,.55) 70%,rgba(0,0,0,0))"></div>
<div class="shade" style="top:1250px;height:670px;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,.45) 60%,rgba(0,0,0,0))"></div>
<div class="brand"><div class="logo">WORLD<b>DECODED</b></div></div>
<div class="tag">ANALYSIS</div>
<div class="head" id="head">Europe slams the brakes on <span class="r">Chinese hybrids</span></div>
<div class="line" id="line"></div>
<div class="scene" id="scene"></div>
<div class="caps" id="caps"></div>
<div class="src" id="src">Sources: European Commission via AFP · The Auto Wire · ChinaEVHome · Pixabay footage</div>
<script>
const W = __CAPS__;
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
function inout(t, a, b, d = 0.35) { return Math.min(ease((t - a) / d), ease((b - t) / d)); }
function captions(t) {
  // groupe de ~4 mots autour du mot en cours
  let k = W.findIndex((x) => t < x.e); if (k < 0) k = W.length - 1;
  const g = Math.floor(k / 4) * 4; const grp = W.slice(g, g + 4);
  if (t > W[W.length - 1].e + 0.6) return '';
  return grp.map((x, i) => `<span class="${t >= x.s && t < x.e + 0.05 ? 'now' : t >= x.s ? 'on' : ''}">${x.w}</span>`).join(' ');
}
function scene(t) {
  if (t < 4.6) {
    const a = ease((t - 1.0) / 0.5);
    return `<div class="card" style="opacity:${a};transform:translateY(${(1-a)*40}px);text-align:center"><div class="lbl" style="font-size:54px">🇪🇺 EU &nbsp;vs&nbsp; 🇨🇳 CHINA</div><div class="sub">New import limit · adopted Nov 24, 2026</div></div>`;
  }
  if (t < 13.5) {
    const a = inout(t, 4.6, 13.5); const n = 350000 * ease((t - 4.9) / 2.2);
    return `<div class="card" style="opacity:${a};transform:scale(${0.94+0.06*a})"><div class="lbl">HYBRIDS FROM CHINA · PER YEAR</div><div class="big">${fmt(n)}</div><div class="sub">Quota starts December 1, 2026</div>${t > 10.6 ? `<div class="badge" style="opacity:${ease((t-10.6)/0.3)}">QUOTA FULL = NO ENTRY</div>` : ''}</div>`;
  }
  if (t < 23.1) {
    const a = inout(t, 13.5, 23.1); const h1 = 230 * ease((t - 16.8) / 1.2), h2 = 380 * (10 / 45.3) * ease((t - 21.0) / 0.8);
    return `<div class="card" style="opacity:${a}"><div class="lbl" style="text-align:center;margin-bottom:10px">EU IMPORT DUTIES</div><div class="duty">
      <div class="col"><div class="val" style="color:#e63946">${t > 17 ? 'UP TO 45%' : ''}</div><div class="bar" style="height:${h1}px;background:#e63946"></div><div class="cap">Chinese electric cars<br><span style="opacity:.7;font-size:26px">10% + extra duty up to 35.3%</span></div></div>
      <div class="col"><div class="val" style="color:#ffd166">${t > 21 ? '10%' : ''}</div><div class="bar" style="height:${h2}px;background:#ffd166"></div><div class="cap">Hybrids<br><span style="opacity:.7;font-size:26px">standard duty only</span></div></div></div></div>`;
  }
  if (t < 32.9) {
    const a = inout(t, 23.1, 32.9);
    const bars = [[107000, '2024', 24.6], [302000, '2025', 27.2], [800000, '2026*', 30.0]];
    const cols = bars.map(([v, y, s]) => { const e = ease((t - s) / 0.9); return `<div class="col"><div class="val" style="font-size:72px;color:${y==='2026*'?'#e63946':'#ffd166'}">${e>0?fmt(v*e/1000)+'K':''}</div><div class="bar" style="height:${250*v/800000*e}px;background:${y==='2026*'?'repeating-linear-gradient(45deg,#e63946 0 18px,#b02a35 18px 36px)':'#ffd166'}"></div><div class="cap" style="font-size:40px">${y}</div></div>`; }).join('');
    return `<div class="card" style="opacity:${a}"><div class="lbl" style="text-align:center">CHINESE HYBRIDS SHIPPED TO THE EU</div><div class="duty" style="height:470px">${cols}</div><div class="sub" style="text-align:center;font-size:24px">*2026: EU Commission forecast without a cap</div></div>`;
  }
  if (t < 46.9) {
    const a = inout(t, 32.9, 46.9);
    const list = [['🇨🇳 China', 33.4], ['🇯🇵 Japan', 37.7], ['🇬🇧 UK', 38.6], ['🇲🇦 Morocco', 39.0], ['🇹🇷 Turkey', 39.3], ['🇰🇷 South Korea', 39.5], ['🇺🇸 USA', 39.7]];
    const chips = list.map(([c, s]) => `<div class="chip ${c.includes('China')?'hot':''}" style="opacity:${ease((t-s)/0.3)};transform:scale(${0.8+0.2*ease((t-s)/0.3)})">${c}</div>`).join('');
    return `<div class="card" style="opacity:${a}"><div class="lbl">A QUOTA, NOT A TARIFF: IT HITS EVERY EXPORTER</div><div class="chips" style="margin-top:26px">${chips}</div>
      ${t > 40.0 ? `<div class="badge" style="opacity:${ease((t-40)/0.3)};background:#1d3557">CHINA: "WE MAY GO TO THE WTO"</div>` : ''}
      ${t > 42.3 ? `<div class="badge" style="opacity:${ease((t-42.3)/0.3)};background:#2a9d8f">NOT COVERED: RANGE-EXTENDER EVs</div>` : ''}</div>`;
  }
  const a = ease((t - 47.1) / 0.4);
  return `<div class="card" style="opacity:${a};text-align:center"><div class="lbl" style="color:#ffd166">THE TAKEAWAY</div><div style="font-family:Anton;font-size:84px;line-height:1.08;margin-top:14px">FEWER CHEAP HYBRIDS<br>= HIGHER PRICES?</div>
    ${t > 52.2 ? `<div class="badge" style="opacity:${ease((t-52.2)/0.3)}">THE TRADE WAR CHANGED LANES</div>` : ''}</div>`;
}
window.render = (t) => {
  const h = ease(t / 0.6); document.getElementById('head').style.cssText = `opacity:${h};transform:translateY(${(1-h)*-30}px)`;
  document.getElementById('line').style.width = (952 * ease((t - 0.3) / 0.8)) + 'px';
  document.getElementById('scene').innerHTML = scene(t);
  document.getElementById('caps').innerHTML = captions(t);
};
</script></body></html>
