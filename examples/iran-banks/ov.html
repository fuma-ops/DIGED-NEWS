<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.brand{position:absolute;top:120px;left:70px;display:flex;align-items:center;gap:16px}
.brand .logo{font-family:Anton;font-size:40px;letter-spacing:2px}
.brand .logo b{color:#e63946}
.tag{position:absolute;top:122px;right:70px;background:#e63946;font-weight:900;font-size:28px;padding:8px 18px;letter-spacing:2px;border-radius:6px}
.shade{position:absolute;left:0;right:0}
.head{position:absolute;top:200px;left:60px;right:60px;font-family:Anton;font-size:150px;line-height:1.02;padding-bottom:22px;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.7)}
.head .r{color:#ffd166}
.line{position:absolute;top:530px;left:64px;height:8px;background:#e63946;border-radius:4px}
.scene{position:absolute;left:60px;right:60px;top:610px;height:660px}
.card{background:rgba(10,14,28,.78);border:2px solid rgba(255,255,255,.12);border-radius:28px;padding:40px 44px;backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.big{font-family:Anton;font-size:190px;line-height:1;color:#ffd166}
.lbl{font-weight:800;font-size:40px;opacity:.95}
.sub{font-weight:600;font-size:32px;opacity:.8;margin-top:10px}
.badge{display:inline-block;margin-top:26px;background:#e63946;font-weight:900;font-size:36px;padding:12px 22px;border-radius:12px}
.duty{display:flex;align-items:flex-end;gap:60px;height:480px;padding:0 30px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:100%;border-radius:16px 16px 6px 6px;flex-shrink:0}
.val{font-family:Anton;font-size:76px;margin-bottom:10px;white-space:nowrap;flex-shrink:0}
.cap{font-weight:800;font-size:32px;margin-top:16px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:18px}
.chip{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);font-weight:800;font-size:40px;padding:12px 26px;border-radius:999px}
.chip.hot{background:#e63946;border-color:#e63946}
.caps{position:absolute;left:70px;right:70px;top:1330px;text-align:center;font-weight:900;font-size:62px;line-height:1.18;text-transform:uppercase;text-shadow:0 4px 16px rgba(0,0,0,.95),0 0 4px #000}
.caps span{opacity:.55}.caps span.on{opacity:1}.caps span.now{color:#ffd166;opacity:1}
.src{position:absolute;left:70px;bottom:250px;font-weight:600;font-size:24px;opacity:.75}
</style></head><body>
</head><body>
<div class="shade" style="top:0;height:760px;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.55) 70%,rgba(0,0,0,0))"></div>
<div class="shade" style="top:1250px;height:670px;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,.45) 60%,rgba(0,0,0,0))"></div>
<div class="brand"><div class="logo">DIGED<b> NEWS</b></div></div>
<div class="tag">EXPLAINED</div>
<div class="head" id="head">The war <span class="r">you can't see</span></div>
<div class="line" id="line"></div>
<div class="scene" id="scene"></div>
<div class="caps" id="caps"></div>
<div class="src">Sources: US Treasury (OFAC) via Gulf News · CBS News · PBS · Pixabay footage</div>
<script>
const W = __CAPS__;
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
function inout(t, a, b, d = 0.35) { return Math.min(ease((t - a) / d), ease((b - t) / d)); }
const pop = (t, s) => `opacity:${ease((t-s)/0.3)};transform:scale(${0.85+0.15*ease((t-s)/0.3)})`;
function captions(t) {
  let k = W.findIndex((x) => t < x.e); if (k < 0) k = W.length - 1;
  const g = Math.floor(k / 4) * 4; const grp = W.slice(g, g + 4);
  if (t > W[W.length - 1].e + 0.6) return '';
  return grp.map((x) => `<span class="${t >= x.s && t < x.e + 0.05 ? 'now' : t >= x.s ? 'on' : ''}">${x.w}</span>`).join(' ');
}
const ico = (e, s) => `<div style="font-size:${s||110}px;line-height:1">${e}</div>`;
function scene(t) {
  if (t < 3.8) {
    const a = ease((t - 0.6) / 0.4);
    return `<div class="card" style="opacity:${a};text-align:center"><div style="display:flex;justify-content:center;gap:50px;align-items:center">${ico('🇺🇸',120)}<div class="lbl" style="font-size:60px">VS</div>${ico('🇮🇷',120)}</div>
      ${t > 2.9 ? `<div class="badge" style="${pop(t,2.9)};font-size:52px">WEAPON: 🏦 BANKS</div>` : ''}</div>`;
  }
  if (t < 13.5) {
    const a = inout(t, 3.8, 13.5); const c = 22 * ease((t - 7.0) / 0.8), p = 8 * ease((t - 8.0) / 0.6);
    return `<div class="card" style="opacity:${a}"><div class="lbl">🇺🇸 NEW US SANCTIONS · MONDAY</div><div class="sub">Target: Iran's secret money network</div>
      <div style="display:flex;gap:40px;margin-top:20px"><div><div class="big" style="font-size:150px">${t>7?Math.round(c):''}</div><div class="lbl">companies</div></div><div><div class="big" style="font-size:150px">${t>8?Math.round(p):''}</div><div class="lbl">people</div></div></div>
      ${t > 10.7 ? `<div class="badge" style="${pop(t,10.7)}">ONE OF THEM: TENS OF BILLIONS $ A YEAR</div>` : ''}</div>`;
  }
  if (t < 25.1) {
    const a = inout(t, 13.5, 25.1);
    const step = (e, l, s) => `<div style="text-align:center;${pop(t,s)}">${ico(e,96)}<div class="cap" style="margin-top:8px">${l}</div></div>`;
    const arrow = (s) => `<div style="font-size:60px;opacity:${ease((t-s)/0.3)}">➜</div>`;
    const cut = t > 19.4;
    return `<div class="card" style="opacity:${a}"><div class="lbl" style="text-align:center;margin-bottom:24px">HOW IRAN GETS PAID</div>
      <div style="display:flex;align-items:center;justify-content:space-between">${step('🛢️','Iran sells oil',14.7)}${arrow(15.9)}${step('🏦','Secret banks',17.8)}${arrow(16.8)}<div style="position:relative">${step('🇮🇷','Money home',16.9)}${cut?`<div style="position:absolute;inset:-10px;display:flex;align-items:center;justify-content:center;font-size:170px;color:#e63946;${pop(t,19.4)}">✖</div>`:''}</div></div>
      ${t > 20.1 ? `<div class="badge" style="${pop(t,20.1)}">✂️ CUT THE BANKS = CASH STUCK</div>` : ''}
      ${t > 21.5 ? `<div class="badge" style="${pop(t,21.5)};background:#1d3557">⚠️ DEAL WITH IRAN? YOU RISK SANCTIONS TOO</div>` : ''}</div>`;
  }
  if (t < 35.7) {
    const a = inout(t, 25.1, 35.7); const cl = ease((t - 30.6) / 0.4);
    const cond = [['End the war', 31.9], ['Lift the naval blockade', 32.9], ['Drop the sanctions', 34.4]].map(([c, s]) => `<div class="chip" style="${pop(t,s)};font-size:34px">✔ ${c}</div>`).join('');
    return `<div class="card" style="opacity:${a};padding:30px 34px"><div class="lbl">IRAN'S CARD: THE STRAIT OF HORMUZ</div>
      <svg viewBox="0 0 900 300" style="width:100%;margin-top:14px;border-radius:18px;background:#0d3b66">
        <path d="M0 0 H900 V95 C760 110 700 70 600 85 C520 98 470 140 430 120 C360 85 250 110 0 120 Z" fill="#c9a66b"/>
        <path d="M0 300 V230 C120 210 250 225 330 200 C390 182 420 170 455 150 C470 175 500 190 560 200 C650 215 760 240 900 250 V300 Z" fill="#b08d57"/>
        <text x="620" y="50" font-size="40" font-weight="900" fill="#3a2a10">IRAN</text>
        <text x="90" y="175" font-size="30" font-weight="800" fill="#bfe3ff">PERSIAN GULF</text>
        <text x="640" y="180" font-size="26" font-weight="800" fill="#bfe3ff">GULF OF OMAN</text>
        <text x="120" y="280" font-size="28" font-weight="900" fill="#3a2a10">ARABIAN PENINSULA</text>
        <circle cx="442" cy="135" r="${10+30*cl}" fill="none" stroke="#e63946" stroke-width="6" opacity="${cl}"/>
        <line x1="442" y1="112" x2="442" y2="158" stroke="#e63946" stroke-width="12" opacity="${cl}"/>
        <text x="380" y="245" font-size="28" font-weight="900" fill="#e63946" opacity="${cl}">CLOSED</text>
      </svg><div class="sub" style="margin-top:10px">Iran will reopen it only if America:</div><div class="chips" style="margin-top:10px">${cond}</div></div>`;
  }
  if (t < 42.4) {
    const a = inout(t, 35.7, 42.4);
    const step = (e, l, s) => `<div style="text-align:center;${pop(t,s)}">${ico(e,110)}<div class="cap">${l}</div></div>`;
    return `<div class="card" style="opacity:${a}"><div class="lbl" style="text-align:center;color:#ffd166">WHY IT MATTERS TO YOU</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:30px">${step('🚧','Route blocked',37.5)}<div style="font-size:60px">➜</div>${step('🛢️','Oil at risk',38.6)}<div style="font-size:60px">➜</div>${step('⛽','Your gas price',41.0)}</div></div>`;
  }
  const a = ease((t - 42.6) / 0.4);
  return `<div class="card" style="opacity:${a};text-align:center"><div style="font-family:Anton;font-size:80px;line-height:1.1">NOT ONLY MISSILES 🚀<br><span style="color:#ffd166">${t>44.7?'MONEY 💵':''}</span></div>
    ${t > 45.8 ? `<div class="badge" style="${pop(t,45.8)}">FOLLOW DIGED NEWS</div>` : ''}</div>`;
}
window.render = (t) => {
  const h = ease(t / 0.6); document.getElementById('head').style.cssText = `opacity:${h};transform:translateY(${(1-h)*-30}px)`;
  document.getElementById('line').style.width = (952 * ease((t - 0.3) / 0.8)) + 'px';
  document.getElementById('scene').innerHTML = scene(t);
  document.getElementById('caps').innerHTML = captions(t);
};
</script></body></html>
