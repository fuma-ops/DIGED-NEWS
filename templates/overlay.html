<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.brand{position:absolute;top:120px;left:70px;display:flex;align-items:center;gap:16px}
.brand .logo{font-family:Anton;font-size:40px;letter-spacing:2px}
.brand .logo b{color:#e63946}
.tag{position:absolute;top:122px;right:70px;background:#e63946;font-weight:900;font-size:28px;padding:8px 18px;letter-spacing:2px;border-radius:6px}
.shade{position:absolute;left:0;right:0}
.head{position:absolute;top:200px;left:60px;right:60px;font-family:Anton;font-size:150px;line-height:1.02;padding-bottom:22px;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.7)}
.head .r{color:#ffd166}
.line{position:absolute;top:530px;left:64px;height:8px;background:#e63946;border-radius:4px}
.scene{position:absolute;left:60px;right:60px;top:610px;height:660px}
.card{background:rgba(10,14,28,.78);border:2px solid rgba(255,255,255,.12);border-radius:28px;padding:40px 44px;backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.big{font-family:Anton;font-size:190px;line-height:1;color:#ffd166}
.lbl{font-weight:800;font-size:40px;opacity:.95}
.sub{font-weight:600;font-size:32px;opacity:.8;margin-top:10px}
.badge{display:inline-block;margin-top:26px;background:#e63946;font-weight:900;font-size:36px;padding:12px 22px;border-radius:12px}
.duty{display:flex;align-items:flex-end;gap:60px;height:480px;padding:0 30px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:100%;border-radius:16px 16px 6px 6px;flex-shrink:0}
.val{font-family:Anton;font-size:76px;margin-bottom:10px;white-space:nowrap;flex-shrink:0}
.cap{font-weight:800;font-size:32px;margin-top:16px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:18px}
.chip{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);font-weight:800;font-size:40px;padding:12px 26px;border-radius:999px}
.chip.hot{background:#e63946;border-color:#e63946}
.caps{position:absolute;left:70px;right:70px;top:1330px;text-align:center;font-weight:900;font-size:62px;line-height:1.18;text-transform:uppercase;text-shadow:0 4px 16px rgba(0,0,0,.95),0 0 4px #000}
.caps span{opacity:.55}.caps span.on{opacity:1}.caps span.now{color:#ffd166;opacity:1}
.src{position:absolute;left:70px;bottom:250px;font-weight:600;font-size:24px;opacity:.75}
</style></head><body>
</head><body>
<div class="shade" style="top:0;height:760px;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.55) 70%,rgba(0,0,0,0))"></div>
<div class="shade" style="top:1250px;height:670px;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,.45) 60%,rgba(0,0,0,0))"></div>
<div class="brand"><div class="logo">DIGED<b> NEWS</b></div></div>
<div class="tag">__TAG__</div>
<div class="head" id="head">__HEADLINE__</div>
<div class="line" id="line"></div>
<div class="scene" id="scene"></div>
<div class="caps" id="caps"></div>
<div class="src">Sources: __SOURCES__ · Pixabay footage</div>
<script>
const W = __CAPS__;
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
function inout(t, a, b, d = 0.35) { return Math.min(ease((t - a) / d), ease((b - t) / d)); }
const pop = (t, s) => `opacity:${ease((t-s)/0.3)};transform:scale(${0.85+0.15*ease((t-s)/0.3)})`;
function captions(t) {
  let k = W.findIndex((x) => t < x.e); if (k < 0) k = W.length - 1;
  const g = Math.floor(k / 4) * 4; const grp = W.slice(g, g + 4);
  if (t > W[W.length - 1].e + 0.6) return '';
  return grp.map((x) => `<span class="${t >= x.s && t < x.e + 0.05 ? 'now' : t >= x.s ? 'on' : ''}">${x.w}</span>`).join(' ');
}
const ico = (e, s) => `<div style="font-size:${s||110}px;line-height:1">${e}</div>`;
function scene(t) {
  // SCÈNES DU SHORT : une branche « if (t < fin) { ... return `<div class="card">...</div>`; } » par partie
  // (accroche, ce qui s'est passé, pourquoi, pour toi, à retenir). Voir examples/ pour des modèles.
  return '';
}
window.render = (t) => {
  const h = ease(t / 0.6); document.getElementById('head').style.cssText = `opacity:${h};transform:translateY(${(1-h)*-30}px)`;
  document.getElementById('line').style.width = (952 * ease((t - 0.3) / 0.8)) + 'px';
  document.getElementById('scene').innerHTML = scene(t);
  document.getElementById('caps').innerHTML = captions(t);
};
</script></body></html>
